<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Washroom Watch</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--tile:#E6F1EE;--grout:#CFE2DD;--pine:#0F3D3E;--ink:#12302F;--muted:#5B7774;--sign:#F5C518;--paper:#fff;--bad:#C8442F;--ok:#1E8E5A;--prog:#2A74C9}
*{box-sizing:border-box}
body{margin:0;font-family:"Hind Siliguri",system-ui,sans-serif;color:var(--ink);background:var(--tile);background-image:linear-gradient(var(--grout) 1px,transparent 1px),linear-gradient(90deg,var(--grout) 1px,transparent 1px);background-size:56px 56px;line-height:1.6}
h1,h2,h3,.kpi b{font-family:"Bricolage Grotesque",sans-serif;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.bar{background:var(--pine);color:#fff;position:sticky;top:0;z-index:20}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font:800 1.2rem "Bricolage Grotesque";display:flex;gap:10px;align-items:center}
.brand i{width:28px;height:28px;background:var(--sign);border-radius:7px;display:grid;place-items:center;color:var(--pine);font-style:normal}
.bar a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px}.bar a:hover{background:rgba(255,255,255,.12)}
.head{padding:36px 0 14px;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.head h1{font-size:clamp(2rem,4.5vw,3.1rem);color:var(--pine);letter-spacing:-.02em}
.btn{background:var(--pine);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 .95rem "Hind Siliguri";cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:14px 0}
.kpi{background:var(--paper);border:1px solid var(--grout);border-radius:14px;padding:18px;border-top:5px solid var(--sign)}
.kpi b{display:block;font-size:2.4rem;color:var(--pine);line-height:1.1}.kpi span{color:var(--muted);font-size:.9rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:40px}
.panel{background:var(--paper);border:1px solid var(--grout);border-radius:14px;padding:20px}
.panel h3{font-size:1.1rem;margin-bottom:14px;color:var(--pine)}
.row{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.row div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{background:var(--grout);border-radius:99px;height:12px;overflow:hidden}.fill{height:100%;background:var(--pine);border-radius:99px}
.trend{display:flex;align-items:flex-end;gap:5px;height:140px}
.trend i{flex:1;background:var(--pine);border-radius:5px 5px 0 0;min-height:3px;position:relative}
.trend i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.72rem;padding:2px 6px;border-radius:5px;white-space:nowrap}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-top:6px}
.alert{background:var(--sign);color:var(--pine);border-radius:12px;padding:12px 16px;font-weight:600;margin:6px 0}
.empty{text-align:center;color:var(--muted);padding:40px}
[data-theme=dark]{--tile:#0E2223;--grout:#1F3B3B;--ink:#E4F1EE;--muted:#9BB5B1;--pine:#1F8A82;--paper:#14302F}
#themeBtn{position:fixed;right:16px;bottom:16px;z-index:50;width:44px;height:44px;border-radius:50%;border:0;background:var(--sign);color:#0F3D3E;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* premium upgrade */
body{-webkit-font-smoothing:antialiased;background-image:linear-gradient(rgba(15,61,62,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(15,61,62,.05) 1px,transparent 1px)}
.bar{background:linear-gradient(90deg,#0A2F30,#0F3D3E);box-shadow:0 8px 24px -12px rgba(5,25,25,.7);border-bottom:3px solid var(--sign)}
.card,.dept,.panel,.kpi,.rep,.nt{box-shadow:0 20px 40px -24px rgba(15,61,62,.5);border-color:rgba(15,61,62,.1)}
.btn{background:linear-gradient(180deg,#16595C,#0F3D3E);box-shadow:0 8px 18px -8px rgba(15,61,62,.7),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .15s,box-shadow .15s;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-1px)}
.btn.y{background:linear-gradient(180deg,#FFD83D,#F5C518);color:#0F3D3E}
input,select,textarea{transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px rgba(15,61,62,.14)}
.hero{background:radial-gradient(circle at 88% 15%,rgba(245,197,24,.3),transparent 45%)}
h1,h2{letter-spacing:-.015em}
/* notice board */
.pill{display:inline-block;background:var(--pine);color:#fff;font-weight:600;font-size:.82rem;padding:4px 14px;border-radius:99px;margin-bottom:14px}
.nhead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.nt{background:var(--paper);border:1px solid var(--grout);border-radius:16px;padding:24px;border-top:6px solid var(--sign)}
.nt h3{font-size:1.3rem;color:var(--pine)}
.nt h3 small{display:block;font:500 .92rem "Hind Siliguri";color:var(--muted);margin-top:3px}
.nt ul{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:14px}
.nt li{display:grid;grid-template-columns:26px 1fr;gap:12px;line-height:1.45}
.nt li:before{content:"\2713";width:26px;height:26px;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:700}
.nt li b{font-weight:600;display:block}.nt li span{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.nbar{background:linear-gradient(90deg,#0A2F30,#0F3D3E);color:#fff;border-radius:16px;padding:20px 24px;margin-top:16px;border-left:8px solid var(--sign)}
.nbar b{display:block;font-size:1.05rem}.nbar span{opacity:.8;font-size:.92rem}
@media print{body.pn .bar,body.pn .hero,body.pn #report,body.pn #feed,body.pn footer,body.pn #themeBtn,body.pn .noprint{display:none!important}body.pn{background:#fff}}
</style>
</head>
<body>
<div class="bar"><div class="wrap"><div class="brand"><i>W</i> Washroom Watch</div>
<nav><a href="index.html">Report</a><a href="departments.html">By department</a></nav></div></div>
<div class="wrap">
  <div class="head"><h1>Dashboard</h1><button class="btn" id="csv">Download CSV</button></div>
  <div id="alert"></div>
  <div class="kpis" id="kpis"><div class="empty">Loading…</div></div>
  <div class="cols" id="cols"></div>
</div>
<script>
const CONFIG = { SCRIPT_URL: "PASTE_APPS_SCRIPT_EXEC_URL" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
let D = [];

fetch(CONFIG.SCRIPT_URL).then(r => r.json()).then(j => { D = j.data || []; draw(); })
  .catch(() => $("#kpis").innerHTML = '<div class="empty">Could not load data. Check SCRIPT_URL.</div>');

const count = (key) => { const m = {}; D.forEach(r => { const k = String(r[key] || "Unspecified").trim() || "Unspecified"; m[k] = (m[k]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
const bars = list => { const max = Math.max(1, ...list.map(x=>x[1])); return list.slice(0,8).map(([k,v]) => `<div class="row"><div title="${esc(k)}">${esc(k)}</div><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div><b>${v}</b></div>`).join("") || '<div class="empty">No data</div>'; };

function draw(){
  const tot = D.length, res = D.filter(r => r.status === "Resolved"), pen = D.filter(r => r.status === "Pending");
  const hrs = res.map(r => (new Date(String(r.updatedat).replace(" ","T")) - new Date(String(r.timestamp).replace(" ","T"))) / 36e5).filter(x => x >= 0);
  const avg = hrs.length ? (hrs.reduce((a,b)=>a+b,0)/hrs.length) : null;
  const high = pen.filter(r => r.severity === "High").length;
  $("#alert").innerHTML = high ? `<div class="alert">${high} high-severity report${high>1?"s":""} still pending. Needs attention now.</div>` : "";
  $("#kpis").innerHTML = [
    [tot,"Total reports"],[pen.length,"Pending"],[tot ? Math.round(res.length/tot*100)+"%" : "–","Resolution rate"],
    [avg===null ? "–" : (avg < 48 ? avg.toFixed(1)+" h" : (avg/24).toFixed(1)+" d"),"Average time to resolve"]
  ].map(([n,l]) => `<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join("");

  const days = [...Array(14)].map((_,i) => { const d = new Date(); d.setDate(d.getDate()-13+i); return d.toISOString().slice(0,10); });
  const per = days.map(d => D.filter(r => String(r.timestamp).startsWith(d)).length), mx = Math.max(1,...per);
  $("#cols").innerHTML =
    `<div class="panel"><h3>Reports by department</h3>${bars(count("department"))}</div>
     <div class="panel"><h3>Hotspot locations</h3>${bars(count("location"))}</div>
     <div class="panel"><h3>Issue types</h3>${bars(count("category"))}</div>
     <div class="panel"><h3>Most frequent reporters</h3>${bars(count("name").filter(x => x[0] !== "Anonymous"))}</div>
     <div class="panel" style="grid-column:1/-1"><h3>Last 14 days</h3><div class="trend">${per.map((n,i)=>`<i style="height:${n/mx*100}%" data-t="${days[i].slice(5)}: ${n}"></i>`).join("")}</div><div class="axis"><span>${days[0].slice(5)}</span><span>${days[13].slice(5)}</span></div></div>`;
}

$("#csv").onclick = () => {
  const cols = ["id","timestamp","name","position","department","location","category","severity","description","photo","status","adminnote","updatedat"];
  const q = v => '"' + String(v ?? "").replace(/"/g,'""') + '"';
  const csv = "\ufeff" + [cols.join(","), ...D.map(r => cols.map(c => q(r[c])).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = "washroom-reports-" + new Date().toISOString().slice(0,10) + ".csv"; a.click();
};
</script>
<button id="themeBtn" aria-label="Toggle dark mode">&#9790;</button>
<script>
(function(){var r=document.documentElement,t=localStorage.getItem("ww_theme");if(t)r.dataset.theme=t;
document.getElementById("themeBtn").onclick=function(){var n=r.dataset.theme==="dark"?"light":"dark";r.dataset.theme=n;localStorage.setItem("ww_theme",n)}})();
</script>
</body>
</html>
